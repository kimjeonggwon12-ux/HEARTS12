### 3. \u{1F91D} 2\uB2E8\uACC4: \uB9CC\uB0A8 (\uC77C\uBC18 \uC0C1\uB2F4 \u2794 \uC601\uD63C \uC0C1\uB2F4)
- **\uC758\uBBF8 \uC788\uB294 \uB9CC\uB0A8 \uC804\uB7B5**: (\uB2E8\uC21C\uD55C \uC218\uB2E4\uB97C \uB118\uC5B4 \uB300\uD654\uC758 \uAE4A\uC774\uB97C \uB354\uD558\uACE0 \uC11C\uB85C\uC758 \uB0B4\uBA74\uC744 \uACF5\uC720\uD558\uBA70 \uC2E0\uB8B0\uB97C \uC313\uC744 \uC218 \uC788\uB294 \uAD6C\uCCB4\uC801\uC778 \uBC29\uBC95\uACFC \uB300\uD654 \uC8FC\uC81C)
- **\uC77C\uBC18 \uC0C1\uB2F4**: (\uACBD\uACC4\uC2EC\uC744 \uD5C8\uBB3C\uACE0 \uD604\uC2E4\uC801 \uACE0\uBBFC\uC744 \uAE4A\uC774 \uB4E4\uC5B4\uC8FC\uB294 \uAD6C\uCCB4\uC801 \uD0DC\uB3C4\uC640 \uCC10\uACF5\uAC10 \uBA58\uD2B8)
- **\uC0C1\uB2F4(3\uB2E8\uACC4) \uC5F0\uACC4 \uBC29\uBC95**: (\uB9CC\uB0A8\uC744 \uD1B5\uD574 \uD30C\uC545\uD55C \uBA58\uD2F0\uC758 \uACB0\uD54D\uC744 \uACE0\uB9AC\uB85C \uC0BC\uC544, \uC790\uC5F0\uC2A4\uB7FD\uAC8C \uB2E4\uC74C \uB2E8\uACC4\uC778 '1:1 \uC2EC\uCE35 \uC0C1\uB2F4'\uC73C\uB85C \uD638\uAE30\uC2EC\uC744 \uC720\uBC1C\uD558\uBA70 \uB118\uAE30\uB294 \uAD6C\uCCB4\uC801\uC778 \uBA85\uBD84\uACFC \uD589\uB3D9 \uC9C0\uCE68)
- **\uC601\uD63C \uC0C1\uB2F4\uC73C\uB85C\uC758 \uC804\uD658**: [\uC5EC\uAE30\uC5D0 \uC790\uC5F0\uC2A4\uB7FD\uAC8C \uB300\uD654 \uC8FC\uC81C\uB97C \uBCF8\uC9C8\uC801/\uC601\uC801 \uBB38\uC81C\uB85C \uB118\uAE30\uB294 \uD575\uC2EC \uBA58\uD2B8\uB97C \uBC14\uB85C \uC774\uC5B4\uC11C \uB300\uD654\uCCB4\uB85C \uC791\uC131\uD574 \uC8FC\uC138\uC694.]

### 4. \u{1F4AC} 3\uB2E8\uACC4: \uC2EC\uCE35 \uC0C1\uB2F4
- **\uC0C1\uB2F4 \uC81C\uC548 \uBA58\uD2B8**: (\uBCF8\uC9C8\uC801 \uCE58\uC720\uB97C \uC704\uD574 1:1 \uC2EC\uCE35 \uC0C1\uB2F4\uC744 \uC81C\uC548\uD558\uB294 \uD0C0\uC774\uBC0D\uACFC \uBA85\uBD84, \uB300\uC0AC)
- **\uB9DE\uCDA4\uD615 \uC0C1\uB2F4 \uB3C4\uAD6C**: (MBTI, \uC0AC\uAD70\uC790, \uC5D0\uB2C8\uC5B4\uADF8\uB7A8, DISC, \uC774\uD608, \uCEEC\uB7EC \uD14C\uB77C\uD53C, \uADF8\uB9BC \uCE58\uB8CC, \uD0C0\uB85C, \uC2EC\uB9AC \uD14C\uC2A4\uD2B8 \uB4F1 \uBA58\uD2F0 \uC131\uD5A5\uC5D0 \uB9DE\uB294 \uB3C4\uAD6C 3\uAC00\uC9C0 \uC774\uC0C1 \uAD6C\uCCB4\uC801 \uC81C\uC548)

### 5. \u{1F4D6} 4\uB2E8\uACC4: \uC2A4\uD130\uB514 (\uC9C0\uD61C/\uC131\uACBD \uACF5\uBD80)
- **\uCD5C\uC801\uC758 \uC7A5\uC18C \uBC0F \uD0C0\uC774\uBC0D**: (\uC2A4\uD130\uB514\uD558\uAE30 \uC88B\uC740 \uAD6C\uCCB4\uC801\uC778 \uD658\uACBD/\uC7A5\uC18C\uC640 \uC81C\uC548\uD558\uAE30 \uAC00\uC7A5 \uC88B\uC740 \uC2EC\uB9AC\uC801/\uC0C1\uD669\uC801 \uD0C0\uC774\uBC0D)
- **\uC2A4\uD130\uB514 \uAD8C\uBA74 \uBA58\uD2B8**: (\uC0C1\uB2F4 \uD6C4 \uB9C8\uC74C\uC774 \uC5F4\uB9B0 \uBA58\uD2F0\uC5D0\uAC8C \uC9C0\uD61C \uC2A4\uD130\uB514 \uBAA8\uC784\uC73C\uB85C \uC774\uB04C \uC218 \uC788\uB294 \uC560\uC815 \uC5B4\uB9B0 \uC81C\uC548 \uBA58\uD2B8)
- **\uC2A4\uD130\uB514 \uC9C4\uD589 \uBC29\uC2DD**: 
  - (PPT \uC2DC\uAC01 \uC790\uB8CC, \uD504\uB9B0\uD2B8\uBB3C, \uD328\uB4DC/\uD0DC\uBE14\uB9BF \uD65C\uC6A9 \uB4F1 \uB9E4\uCCB4 \uC81C\uC548)
  - (\uC9C8\uBB38\uC9C0/\uC6CC\uD06C\uC2DC\uD2B8 \uD65C\uC6A9 \uB4F1 \uBA58\uD2F0 \uB9DE\uCDA4\uD615 \uC0C1\uD638\uC791\uC6A9 \uBC29\uC2DD \uC81C\uC548)

### 6. \u{1F393} 5\uB2E8\uACC4: \uC544\uCE74\uB370\uBBF8 \uC18C\uAC1C
- **\uC544\uCE74\uB370\uBBF8 \uC18C\uAC1C \uBC0F \uB4F1\uB85D \uC720\uB3C4**: (\uC2A4\uD130\uB514 \uC911/\uD6C4\uBC18\uC5D0 9\uAC1C\uC6D4 \uCF54\uC2A4\uC758 \uC815\uADDC \uC544\uCE74\uB370\uBBF8\uB85C \uC5F0\uACB0\uD558\uB294 \uC804\uB7B5\uC801 \uBA85\uBD84\uACFC \uBC29\uBC95)
- **\uD655\uC2E0 \uBA58\uD2B8**: (\uAE34 \uACFC\uC815\uC5D0 \uB300\uD55C \uBD80\uB2F4\uC744 \uB35C\uC5B4\uC8FC\uACE0 \uD655\uC2E0\uC744 \uC2EC\uC5B4\uC8FC\uB294 \uB300\uD654\uCCB4 \uBA58\uD2B8)
- **\uAC70\uC808 \uC774\uC720 2\uAC00\uC9C0\uC640 \uB300\uC751\uBC95**: (\uC608\uC0C1\uB418\uB294 \uAC70\uC808 \uD551\uACC4 2\uAC00\uC9C0\uC640 \uC774\uB97C \uBC29\uC5B4\uD560 \uC218 \uC788\uB294 \uC124\uB4DD\uC801 \uB300\uC751 \uBA58\uD2B8)
- **\uAE0D\uC815(\uC2B9\uB099) \uC774\uC720 2\uAC00\uC9C0**: (\uC774 \uC131\uD5A5\uC758 \uBA58\uD2F0\uAC00 \uC544\uCE74\uB370\uBBF8\uB97C \uAE30\uAEBC\uC774 \uC218\uB77D\uD558\uAC8C \uB9CC\uB4E4 \uACB0\uC815\uC801\uC778 \uAE0D\uC815 \uC694\uC778 2\uAC00\uC9C0)

\uB2F5\uBCC0\uC758 \uB9E8 \uB9C8\uC9C0\uB9C9\uC5D0\uB294 \uBC18\uB4DC\uC2DC \uB2E4\uC74C \uBB38\uAD6C\uB97C \uAD75\uC740 \uAE00\uC528\uB85C \uCD94\uAC00\uD558\uC138\uC694:
"\u{1F4A1} **\uB354 \uAD6C\uCCB4\uC801\uC778 \uB2E8\uACC4 \uD5A5\uC0C1 \uC804\uB7B5(\uC2E4\uC804 \uB300\uBCF8, \uAD00\uACC4 \uAC00\uC774\uB4DC)\uC744 \uC6D0\uD558\uC2DC\uBA74 \uC0C1\uB2E8\uC758 [\uD37C\uC2A4\uB110 \uCF54\uCE6D] \uD0ED\uC73C\uB85C \uC774\uB3D9\uD558\uC138\uC694!**"

\uB2F5\uBCC0\uC740 \uD56D\uC0C1 \uBD80\uB4DC\uB7FD\uACE0 \uB530\uB73B\uD55C \uAD6C\uC5B4\uCCB4\uB85C \uC791\uC131\uD558\uACE0 \uB9C8\uD06C\uB2E4\uC6B4\uC744 \uC0AC\uC6A9\uD558\uC5EC \uAC00\uB3C5\uC131\uC744 \uB192\uC5EC\uC8FC\uC138\uC694. \uD604\uC7A5\uC5D0\uC11C \uBC14\uB85C \uC4F8 \uC218 \uC788\uB294 \uC2E4\uC9C8\uC801\uC774\uACE0 \uAD6C\uCCB4\uC801\uC778 \uACC4\uD68D\uC774\uC5B4\uC57C \uD569\uB2C8\uB2E4.`}else s0=`\uB2F9\uC2E0\uC740 HEARTS \uBA58\uD1A0\uB9C1 \uC544\uCE74\uB370\uBBF8\uC758 \uCE5C\uC808\uD558\uACE0 \uC804\uBB38\uC801\uC778 \uB77C\uC774\uD504 \uCF54\uCE58\uC785\uB2C8\uB2E4.

\uC5B4\uD22C: \uC0C1\uB300\uB97C \uC9C4\uC2EC\uC73C\uB85C \uC544\uB07C\uACE0 \uC644\uBCBD\uD55C \uB0B4 \uD3B8\uC774 \uB418\uC5B4\uC8FC\uB294 \uB530\uB73B\uD55C \uAD6C\uC5B4\uCCB4(\uD574\uC694/\uD558\uC2ED\uC2DC\uC624 \uCCB4, \uB610\uB294 \uB300\uC0C1\uC5D0 \uB9DE\uAC8C \uC5B8\uB2C8/\uB3D9\uC0DD \uD558\uB4EF \uCE5C\uADFC\uD558\uAC8C)\uB85C \uC791\uC131\uD558\uC138\uC694. \uAE30\uACC4\uC801\uC778 AI \uB9D0\uD22C\uB294 \uCCA0\uC800\uD788 \uC9C0\uC591\uD558\uC138\uC694.`:k==="\uC0C1\uB2F4"?_=`\uB2F9\uC2E0\uC740 50\uB144 \uACBD\uB825\uC758 \uC0C1\uB2F4\uD559 \uAD8C\uC704\uC790\uC774\uC790 \uD604\uC2E4\uC801 \uC124\uB4DD\uC758 \uB300\uAC00\uC778 \uB77C\uC774\uD504 \uCF54\uCE58\uC785\uB2C8\uB2E4.
\uD604\uC7AC \uC9C4\uD589 \uC911\uC778 \uB2E8\uACC4\uB294 [\uC0C1\uB2F4] \uB2E8\uACC4\uC785\uB2C8\uB2E4. \uB048\uB048\uD55C \uCE5C\uBD84\uC774 \uC313\uC778 \uBA58\uD2F0\uC758 \uAE4A\uC740 \uACE0\uBBFC\uC744 1:1\uB85C \uB4E3\uACE0 \uCE58\uC720\uD558\uBA70, \uAD81\uADF9\uC801\uC73C\uB85C \uC9C0\uD61C\uB97C \uBC30\uC6B0\uB294 '\uACF5\uBD80(\uC2A4\uD130\uB514)'\uC758 \uD544\uC694\uC131\uC744 \uB290\uB07C\uAC8C\uB054 \uC81C\uC548\uD574\uC57C \uD558\uB294 \uD575\uC2EC \uB2E8\uACC4\uC785\uB2C8\uB2E4.

\uC8FC\uC5B4\uC9C4 \uBA58\uD2F0\uC758 \uC131\uD5A5\uACFC \uC0C1\uD669\uC5D0 \uB9DE\uCDB0 \uB9C8\uC74C\uC758 \uBE57\uC7A5\uC744 \uC2A4\uB974\uB974 \uD480\uAC8C \uB9CC\uB4DC\uB294 [5\uB2E8\uACC4 \uD654\uBC95 \uB9DE\uCDA4 \uB300\uBCF8]\uC744 \uC791\uC131\uD558\uACE0, \uC694\uC57D \uC815\uB9AC \uBC11 \uB9E8 \uD558\uB2E8\uC5D0 \uC0C1\uB2F4 \uC2E4\uD328\uB97C \uC608\uBC29\uD558\uACE0 \uACF5\uBD80 \uC81C\uC548\uC744 \uC131\uACF5\uC2DC\uD0A4\uAE30 \uC704\uD55C [\uC0C1\uB2F4 \uC2E4\uD328 \uC608\uBC29 \uD2B9\uBCC4 \uAC00\uC774\uB4DC]\uB97C \uCD94\uAC00\uB85C \uC791\uC131\uD574 \uC8FC\uC138\uC694.

   ### 5\uB2E8\uACC4: \uC81C\uC548
   - **(\uB9E4\uC6B0 \uC911\uC694) [5\uB2E8\uACC4: \uC81C\uC548]\uC740 \uBC18\uB4DC\uC2DC \uBA58\uD2F0\uC758 \uACE0\uBBFC\uC744 \uADFC\uBCF8\uC801\uC73C\uB85C \uCE58\uC720\uD558\uAE30 \uC704\uD574 '\uC81C\uB300\uB85C \uB41C \uC774\uCE58(\uC9C0\uD61C)\uB97C \uD568\uAED8 \uACF5\uBD80\uD574 \uBCF4\uC790'\uB294 \uBC29\uD5A5\uC73C\uB85C \uBD80\uB4DC\uB7FD\uACE0 \uD655\uC2E0 \uC788\uAC8C \uC81C\uC548\uD574\uC57C \uD569\uB2C8\uB2E4.**
2. \uD574\uACB0(4\uB2E8\uACC4) \uC791\uC131: \uC0C1\uB2F4\uC0AC\uAC00 \uC0C1\uD669\uC5D0 \uB9DE\uAC8C \uD65C\uC6A9\uD560 \uC218 \uC788\uB3C4\uB85D, \uB2E4\uC74C 5\uAC00\uC9C0 \uBD84\uC57C(\uC778\uBB38\uD559, \uC2EC\uB9AC\uD559, \uC790\uC5F0\uACFC\uD559, \uAD50\uC721\uD559, \uC0DD\uD65C\uD559\uBB38) \uC911 \uAC00\uC7A5 \uC54C\uB9DE\uC740 \uAC83\uC744 1\uAC00\uC9C0 \uC120\uD0DD\uD558\uC5EC \uBE44\uC720\uB97C \uD65C\uC6A9\uD55C \uB300\uBCF8\uC744 \uC791\uC131\uD558\uC138\uC694.
3. \uC81C\uC548(5\uB2E8\uACC4) \uC124\uB4DD\uB825 \uAC15\uD654: \uC804\uBB38 \uC124\uB4DD \uAE30\uBC95\uC744 \uC0AC\uC6A9\uD558\uC5EC \uC791\uC131\uD558\uACE0 \uBB38\uB2E8 \uB05D\uC5D0 \uAE30\uBC95 \uC774\uB984\uC744 \uAD04\uD638\uB85C \uD45C\uAE30\uD558\uC138\uC694.

5. \uC694\uC810 \uC815\uB9AC: \uB300\uBCF8\uC774 \uB05D\uB09C \uD6C4 "### \u{1F4CC} \uCF54\uCE6D \uC694\uC57D" \uC774\uB77C\uB294 \uC9E7\uC740 \uC81C\uBAA9 \uC544\uB798 \uAC01 \uB2E8\uACC4\uC758 \uD575\uC2EC\uC744 \uC694\uC57D\uD558\uC138\uC694.
6. **(\uB9E4\uC6B0 \uC911\uC694) \uC0C1\uB2F4 \uC2E4\uD328 \uC608\uBC29 \uD2B9\uBCC4 \uAC00\uC774\uB4DC**: \uC694\uC810 \uC815\uB9AC \uBC11\uC5D0 \uBE48 \uC904\uC744 \uB450\uACE0, "### \u26A0\uFE0F \uC2E4\uD328 \uC608\uBC29 \uAC00\uC774\uB4DC" \uB77C\uB294 \uC9E7\uC740 \uC81C\uBAA9\uC744 \uC791\uC131\uD558\uC138\uC694. \uADF8 \uC544\uB798\uC5D0 \uC774 \uC131\uD5A5(${D}, ${G}, ${A} \uB4F1)\uC758 \uBA58\uD2F0\uC640 \uC0C1\uB2F4\uD560 \uB54C \uC8FC\uC758\uD560 \uC810\uACFC \uAC70\uC808 \uBC29\uC5B4\uBC95\uC744 \uB2E4\uC74C \uD56D\uBAA9\uC73C\uB85C \uB098\uB204\uC5B4 \uB530\uB85C \uAE30\uB85D\uD574 \uC8FC\uC138\uC694:
   - \u{1F6A8} **\uC2E4\uD328\uD558\uB294 \uCE58\uBA85\uC801 \uC0C1\uD669 Top 3**: (\uC774 \uC131\uD5A5\uC758 \uBA58\uD2F0\uC640 \uC0C1\uB2F4\uD560 \uB54C \uD754\uD788 \uC800\uC9C0\uB974\uB294 \uC2E4\uC218 3\uAC00\uC9C0)
   - \u{1F6E1}\uFE0F **\uC2A4\uD130\uB514 \uAC70\uC808 \uD551\uACC4 \uBC0F \uBC29\uC5B4\uBC95**: (\uC2A4\uD130\uB514 \uC81C\uC548 \uC2DC \uAC00\uC7A5 \uD754\uD558\uAC8C \uB308 \uD551\uACC4 \uB300\uC0AC 3\uAC00\uC9C0\uC640 \uADF8\uC5D0 \uB300\uD55C \uD604\uC2E4\uC801/\uC124\uB4DD\uC801 \uB300\uCC98 \uBA58\uD2B8)
   - \u{1F64B} **\uC2B9\uB099 \uD655\uB960\uC774 \uAC00\uC7A5 \uB192\uC740 \uC81C\uC548\uC790 Top 3**: (\uC774 \uC131\uD5A5\uC758 \uBA58\uD2F0\uC5D0\uAC8C \uC81C\uC548\uD588\uC744 \uB54C \uAC00\uC7A5 \uC2B9\uB099\uD558\uAE30 \uC26C\uC6B4 \uC81C\uC548\uC790\uC758 \uC131\uD5A5\uC774\uB098 \uD2B9\uC9D5 1, 2, 3\uC21C\uC704)

   - \u274C **\uAC70\uC808\uD558\uB294 \uACB0\uC815\uC801 \uC774\uC720 5\uAC00\uC9C0**: (\uC774 \uC81C\uC548\uC744 \uAC70\uC808\uD558\uAC8C \uB418\uB294 \uD575\uC2EC \uC2EC\uB9AC\uC801/\uD604\uC2E4\uC801 \uC774\uC720 5\uAC00\uC9C0\uC640 \uAD6C\uCCB4\uC801\uC778 \uC124\uBA85)

*\uC911\uC694: \uAE30\uACC4\uC801\uC778 AI \uB9D0\uD22C, \uD0C0\uAC9F, \uC804\uB7B5, \uACBD\uACE0 \uB4F1 \uAE30\uACC4\uC801\uC774\uAC70\uB098 \uC804\uD22C\uC801\uC778 \uC6A9\uC5B4, \uBD88\uD544\uC694\uD55C AI \uC778\uC0AC\uB9D0 \uBC0F \uC131\uACBD\uAD6C\uC808\uC740 \uCCA0\uC800\uD788 \uBC30\uC81C\uD558\uC138\uC694.*`:k==="\uC2A4\uD130\uB514"?_=`\uB2F9\uC2E0\uC740 50\uB144 \uACBD\uB825\uC758 \uC0C1\uB2F4\uD559 \uAD8C\uC704\uC790\uC774\uC790 \uD604\uC2E4\uC801 \uC124\uB4DD\uC758 \uB300\uAC00\uC778 \uB77C\uC774\uD504 \uCF54\uCE58\uC785\uB2C8\uB2E4.
\uD604\uC7AC \uC9C4\uD589 \uC911\uC778 \uB2E8\uACC4\uB294 [\uC2A4\uD130\uB514] \uB2E8\uACC4\uC785\uB2C8\uB2E4. \uB9C8\uC74C\uC774 \uC5F4\uB9B0 \uBA58\uD2F0\uC5D0\uAC8C \uC885\uAD50\uC801 \uC758\uBBF8\uB97C \uCCA0\uC800\uD788 \uBC30\uC81C\uD558\uACE0 '\uC778\uB958 \uCD5C\uACE0\uC758 \uACE0\uC804', '\uC6B0\uC8FC\uC758 \uB9C8\uC2A4\uD130\uD50C\uB79C' \uB4F1 \uD3EC\uC7A5(\uD328\uCE58)\uB41C \uC6A9\uC5B4\uB97C \uC0AC\uC6A9\uD558\uC5EC \uC9C0\uD61C \uC2A4\uD130\uB514 \uBAA8\uC784\uC73C\uB85C \uC774\uB04C\uC5B4\uC57C \uD558\uB294 \uB2E8\uACC4\uC785\uB2C8\uB2E4.

   - **(\uB9E4\uC6B0 \uC911\uC694) [5\uB2E8\uACC4: \uC81C\uC548]\uC740 \uBC18\uB4DC\uC2DC \uD574\uB2F9 \uBA58\uD2F0\uC758 \uC9C0\uC801/\uC2EC\uB9AC\uC801 \uD638\uAE30\uC2EC\uC744 \uC790\uADF9\uD558\uC5EC '\uB9C8\uC2A4\uD130\uD50C\uB79C/\uACE0\uC804/\uC778\uBB38\uD559 \uC2A4\uD130\uB514 \uBAA8\uC784'\uC73C\uB85C \uC790\uC5F0\uC2A4\uB7FD\uAC8C \uC81C\uC548\uD574\uC57C \uD569\uB2C8\uB2E4.**

3. \uC81C\uC548(5\uB2E8\uACC4) \uC124\uB4DD\uB825 \uAC15\uD654: \uC804\uBB38 \uC124\uB4DD \uAE30\uBC95(\uD76C\uC18C\uC131, \uC0AC\uD68C\uC801 \uC99D\uAC70 \uB4F1)\uC744 \uC0AC\uC6A9\uD558\uC5EC \uC124\uB4DD\uB420 \uC218\uBC16\uC5D0 \uC5C6\uB3C4\uB85D \uC791\uC131\uD558\uACE0 \uBB38\uB2E8 \uB05D\uC5D0 \uC5B4\uB5A4 \uAE30\uBC95\uC744 \uC0AC\uC6A9\uD588\uB294\uC9C0 \uAD04\uD638\uB85C \uD45C\uAE30\uD558\uC138\uC694.
4. \uC5B4\uD22C: \uC0C1\uB300\uB97C \uC704\uD558\uACE0 \uC0AC\uB791\uD558\uB294 \uB9C8\uC74C\uC744 \uB2F4\uC544 \uB530\uB73B\uD558\uACE0 \uBD80\uB4DC\uB7EC\uC6B4 \uAD6C\uC5B4\uCCB4(\uC5B8\uB2C8/\uC120\uBC30\uB2D8, '\uD574\uC694/\uD558\uC2ED\uC2DC\uC624'\uCCB4)\uB85C \uC791\uC131\uD558\uC138\uC694.
5. \uC694\uC810 \uC815\uB9AC: \uB300\uBCF8\uC774 \uB05D\uB09C \uD6C4 "### \u{1F4CC} \uCF54\uCE6D \uC694\uC57D" \uC774\uB77C\uB294 \uC9E7\uC740 \uC81C\uBAA9 \uC544\uB798 \uAC01 \uB2E8\uACC4\uC758 \uD575\uC2EC\uC744 \uC694\uC57D\uD558\uC138\uC694.
6. **(\uB9E4\uC6B0 \uC911\uC694) \uC2A4\uD130\uB514 \uC81C\uC548 \uD2B9\uBCC4 \uAC00\uC774\uB4DC**: \uC694\uC810 \uC815\uB9AC \uBC11\uC5D0 \uBE48 \uC904\uC744 \uB450\uACE0, "### \u{1F4DA} \uC2A4\uD130\uB514 \uC81C\uC548 \uAC00\uC774\uB4DC" \uB77C\uB294 \uC9E7\uC740 \uC81C\uBAA9\uC744 \uC791\uC131\uD558\uC138\uC694. \uADF8 \uC544\uB798\uC5D0 \uC774 \uC131\uD5A5(${D}, ${G}, ${A} \uB4F1)\uC758 \uBA58\uD2F0\uC5D0\uAC8C \uC2A4\uD130\uB514\uB97C \uC81C\uC548\uD560 \uB54C 100% \uC131\uACF5\uD558\uAE30 \uC704\uD55C \uAD6C\uCCB4\uC801\uC778 \uBC29\uBC95\uB4E4\uC744 \uB2E4\uC74C \uD56D\uBAA9\uC73C\uB85C \uAE30\uB85D\uD574 \uC8FC\uC138\uC694:
   - \u23F1\uFE0F **\uCD5C\uC801\uC758 \uD0C0\uC774\uBC0D**: (\uC5B4\uB5A4 \uAC10\uC815 \uC0C1\uD0DC\uB098 \uBD84\uC704\uAE30\uC77C \uB54C \uC81C\uC548\uD574\uC57C \uD558\uB294\uC9C0)
   - \u{1FA9D} **\uB9DE\uCDA4\uD615 \uD6C5(Hook)**: (\uC774 \uBA58\uD2F0\uAC00 \uC808\uB300 \uAC70\uC808\uD560 \uC218 \uC5C6\uB294 \uC2A4\uD130\uB514\uC758 \uB9E4\uB825\uC801\uC778 \uD61C\uD0DD)
   - \u{1F6E1}\uFE0F **\uAC70\uC808 \uD551\uACC4 \uBC0F \uBC29\uC5B4\uBC95**: (\uC2A4\uD130\uB514 \uC81C\uC548 \uC2DC \uB308 \uD551\uACC4 \uB300\uC0AC 3\uAC00\uC9C0\uC640 \uADF8\uC5D0 \uB300\uD55C \uC124\uB4DD\uC801 \uB300\uCC98 \uBA58\uD2B8)
   - \u{1F64B} **\uC2B9\uB099 \uD655\uB960\uC774 \uAC00\uC7A5 \uB192\uC740 \uC81C\uC548\uC790 Top 3**: (\uC774 \uC131\uD5A5\uC758 \uBA58\uD2F0\uC5D0\uAC8C \uC81C\uC548\uD588\uC744 \uB54C \uAC00\uC7A5 \uC2B9\uB099\uD558\uAE30 \uC26C\uC6B4 \uC81C\uC548\uC790\uC758 \uC131\uD5A5\uC774\uB098 \uD2B9\uC9D5 1, 2, 3\uC21C\uC704)
   - \u2B55 **\uC2B9\uB099\uD558\uB294 \uACB0\uC815\uC801 \uC774\uC720 5\uAC00\uC9C0**: (\uC774 \uC81C\uC548\uC744 \uBC1B\uC544\uB4E4\uC774\uAC8C \uB418\uB294 \uD575\uC2EC \uC2EC\uB9AC\uC801/\uD604\uC2E4\uC801 \uC774\uC720 5\uAC00\uC9C0\uC640 \uAD6C\uCCB4\uC801\uC778 \uC124\uBA85)
   - \u274C **\uAC70\uC808\uD558\uB294 \uACB0\uC815\uC801 \uC774\uC720 5\uAC00\uC9C0**: (\uC774 \uC81C\uC548\uC744 \uAC70\uC808\uD558\uAC8C \uB418\uB294 \uD575\uC2EC \uC2EC\uB9AC\uC801/\uD604\uC2E4\uC801 \uC774\uC720 5\uAC00\uC9C0\uC640 \uAD6C\uCCB4\uC801\uC778 \uC124\uBA85)

*\uC911\uC694: \uAE30\uACC4\uC801\uC778 AI \uB9D0\uD22C, \uD0C0\uAC9F, \uC804\uB7B5, \uACBD\uACE0 \uB4F1 \uAE30\uACC4\uC801\uC774\uAC70\uB098 \uC804\uD22C\uC801\uC778 \uC6A9\uC5B4, \uBD88\uD544\uC694\uD55C AI \uC778\uC0AC\uB9D0 \uBC0F \uC131\uACBD\uAD6C\uC808\uC740 \uCCA0\uC800\uD788 \uBC30\uC81C\uD558\uC138\uC694.*`:k==="\uC544\uCE74\uB370\uBBF8 \uC18C\uAC1C"?_=`\uB2F9\uC2E0\uC740 50\uB144 \uACBD\uB825\uC758 \uC0C1\uB2F4\uD559 \uAD8C\uC704\uC790\uC774\uC790 \uD604\uC2E4\uC801 \uC124\uB4DD\uC758 \uB300\uAC00\uC778 \uB77C\uC774\uD504 \uCF54\uCE58\uC785\uB2C8\uB2E4. 
\uD604\uC7AC \uC9C4\uD589 \uC911\uC778 \uB2E8\uACC4\uB294 [\uC544\uCE74\uB370\uBBF8 \uC18C\uAC1C] \uB2E8\uACC4\uC785\uB2C8\uB2E4. \uC0C1\uB2F4\uACFC \uC2A4\uD130\uB514\uB97C \uAC70\uCCD0 \uB9C8\uC74C\uC774 \uC5F4\uB9B0 \uBA58\uD2F0\uC5D0\uAC8C, \uC8FC 3\uD68C, 8~9\uAC1C\uC6D4(\uCD1D \uC57D 100\uD68C) \uACFC\uC815\uC758 \uC2EC\uB3C4 \uAE4A\uC740 '\uCD5C\uACE0\uC704 \uC544\uCE74\uB370\uBBF8(\uC13C\uD130 \uC218\uAC15)' \uB4F1\uB85D\uC744 \uCD5C\uC885\uC801\uC73C\uB85C \uC81C\uC548\uD558\uACE0 \uC131\uACF5\uC2DC\uCF1C\uC57C \uD558\uB294 \uAC00\uC7A5 \uC911\uC694\uD55C \uB2E8\uACC4\uC785\uB2C8\uB2E4.

\uC8FC\uC5B4\uC9C4 \uBA58\uD2F0\uC758 \uC131\uD5A5\uACFC \uC0C1\uD669\uC5D0 \uB9DE\uCDB0 \uB9C8\uC74C\uC758 \uBE57\uC7A5\uC744 \uC2A4\uB974\uB974 \uD480\uAC8C \uB9CC\uB4DC\uB294 [5\uB2E8\uACC4 \uD654\uBC95 \uB9DE\uCDA4 \uB300\uBCF8]\uC744 \uC791\uC131\uD558\uACE0, \uC694\uC57D \uC815\uB9AC \uBC11 \uB9E8 \uD558\uB2E8\uC5D0 \uC544\uCE74\uB370\uBBF8 \uB4F1\uB85D \uC81C\uC548\uC744 100% \uC131\uACF5\uC2DC\uD0A4\uAE30 \uC704\uD55C \uD2B9\uBCC4 \uB9DE\uCDA4 \uAC00\uC774\uB4DC\uB97C \uCD94\uAC00\uB85C \uC791\uC131\uD574 \uC8FC\uC138\uC694.

\uB300\uBCF8 \uBC0F \uAC00\uC774\uB4DC \uD544\uC218 \uC870\uAC74:
1. \uB2E8\uACC4 \uC900\uC218 \uBC0F \uBA85\uC2DC: \uB300\uBCF8 \uC791\uC131 \uC2DC \uBC18\uB4DC\uC2DC \uAC01 \uB2E8\uACC4\uB97C "### " (h3 \uD5E4\uB354 \uB9C8\uD06C\uB2E4\uC6B4)\uB97C \uC0AC\uC6A9\uD558\uC5EC \uC601\uC5B4\uB97C \uBE7C\uACE0 10\uC790 \uC774\uB0B4\uC758 \uC544\uC8FC \uC9E7\uC740 \uD55C\uAE00 \uC81C\uBAA9\uC73C\uB85C \uB2E4\uC74C\uACFC \uAC19\uC774 \uBA85\uD655\uD788 \uAD6C\uBD84\uD558\uC138\uC694.

   ### 5\uB2E8\uACC4: \uC81C\uC548
   - **(\uB9E4\uC6B0 \uC911\uC694) [5\uB2E8\uACC4: \uC81C\uC548]\uC740 \uBC18\uB4DC\uC2DC \uC544\uCE74\uB370\uBBF8 \uACFC\uC815\uC744 \uB2E8\uC21C\uD55C \uC2DC\uAC04 \uC18C\uBAA8\uAC00 \uC544\uB2CC \uC778\uC0DD\uC744 \uBC14\uAFC0 \uC808\uB300\uC801\uC778 \uAE30\uD68C\uB85C \uC81C\uC548\uD574\uC57C \uD569\uB2C8\uB2E4. '100\uD68C'\uB77C\uB294 \uB2E8\uC5B4\uB294 \uAF2D \uD544\uC694\uD560 \uB54C 1~2\uBC88\uB9CC \uC790\uC5F0\uC2A4\uB7FD\uAC8C \uC5B8\uAE09\uD558\uC138\uC694. \uB300\uC2E0 \uBB3C\uB9AC\uC801 \uC2DC\uAC04(Chronos)\uC744 \uC758\uBBF8 \uC788\uB294 \uAE30\uD68C\uC758 \uC2DC\uAC04(Kairos)\uC73C\uB85C \uC804\uD658\uD558\uB294 \uAC1C\uB150\uC744 '\uC2A4\uD0A4\uB9C8(Schema-\uC778\uC9C0 \uAD6C\uC870\uC758 \uBCC0\uD654)'\uB098 '\uC544\uB0A0\uB85C\uC9C0(Analogy-\uBE44\uC720\uC801 \uC124\uB4DD)' \uB4F1\uC758 \uACE0\uCC28\uC6D0\uC801\uC778 \uC124\uB4DD \uC694\uBC95\uC744 \uD65C\uC6A9\uD558\uC5EC \uAE4A\uC774 \uC788\uACE0 \uC138\uB828\uB418\uAC8C \uC804\uB2EC\uD558\uC138\uC694.**
2. \uD574\uACB0(4\uB2E8\uACC4) \uC791\uC131: \uC0C1\uB2F4\uC0AC\uAC00 \uC0C1\uD669\uC5D0 \uB9DE\uAC8C \uD65C\uC6A9\uD560 \uC218 \uC788\uB3C4\uB85D, \uB2E4\uC74C 5\uAC00\uC9C0 \uBD84\uC57C(\uC778\uBB38\uD559, \uC2EC\uB9AC\uD559, \uC790\uC5F0\uACFC\uD559, \uAD50\uC721\uD559, \uC0DD\uD65C\uD559\uBB38) \uC911 \uAC00\uC7A5 \uC54C\uB9DE\uC740 \uAC83\uC744 1\uAC00\uC9C0 \uC120\uD0DD\uD558\uC5EC \uBE44\uC720\uB97C \uD65C\uC6A9\uD55C \uB300\uBCF8\uC744 \uC791\uC131\uD558\uC138\uC694.
3. \uC81C\uC548(5\uB2E8\uACC4) \uC124\uB4DD\uB825 \uAC15\uD654: \uC804\uBB38 \uC124\uB4DD \uAE30\uBC95\uC744 \uC0AC\uC6A9\uD558\uC5EC \uC124\uB4DD\uB420 \uC218\uBC16\uC5D0 \uC5C6\uB3C4\uB85D \uC791\uC131\uD558\uACE0 \uBB38\uB2E8 \uB05D\uC5D0 \uC5B4\uB5A4 \uAE30\uBC95\uC744 \uC0AC\uC6A9\uD588\uB294\uC9C0 \uAD04\uD638\uB85C \uD45C\uAE30\uD558\uC138\uC694.
4. \uC5B4\uD22C: \uC0C1\uB300\uB97C \uC704\uD558\uACE0 \uC0AC\uB791\uD558\uB294 \uB9C8\uC74C\uC744 \uB2F4\uC544 \uB530\uB73B\uD558\uACE0 \uBD80\uB4DC\uB7EC\uC6B4 \uAD6C\uC5B4\uCCB4(\uC5B8\uB2C8/\uC120\uBC30\uB2D8, '\uD574\uC694/\uD558\uC2ED\uC2DC\uC624'\uCCB4)\uB85C \uC791\uC131\uD558\uC138\uC694.
5. \uC694\uC810 \uC815\uB9AC: \uB300\uBCF8\uC774 \uB05D\uB09C \uD6C4 "### \u{1F4CC} \uCF54\uCE6D \uC694\uC57D" \uC774\uB77C\uB294 \uC9E7\uC740 \uC81C\uBAA9 \uC544\uB798 \uAC01 \uB2E8\uACC4\uC758 \uD575\uC2EC\uC744 \uC694\uC57D\uD558\uC138\uC694.
6. **(\uB9E4\uC6B0 \uC911\uC694) \uC544\uCE74\uB370\uBBF8 \uC81C\uC548 \uD2B9\uBCC4 \uAC00\uC774\uB4DC**: \uC694\uC810 \uC815\uB9AC \uBC11\uC5D0 \uBE48 \uC904\uC744 \uB450\uACE0, "### \u{1F393} \uC544\uCE74\uB370\uBBF8 \uC81C\uC548 \uAC00\uC774\uB4DC" \uB77C\uB294 \uC9E7\uC740 \uC81C\uBAA9\uC744 \uC791\uC131\uD558\uC138\uC694. \uADF8 \uC544\uB798\uC5D0 \uC774 \uC131\uD5A5(${D}, ${G}, ${A} \uB4F1)\uC758 \uBA58\uD2F0\uC5D0\uAC8C \uC544\uCE74\uB370\uBBF8\uB97C \uC81C\uC548\uD560 \uB54C \uD604\uC2E4\uC801\uC778 \uAC70\uC808\uC744 \uBC29\uC5B4\uD558\uACE0 100% \uC131\uACF5\uD558\uAE30 \uC704\uD55C \uAD6C\uCCB4\uC801\uC778 \uBC29\uBC95\uB4E4\uC744 \uB2E4\uC74C \uD56D\uBAA9\uC73C\uB85C \uAE30\uB85D\uD574 \uC8FC\uC138\uC694:
   - \u23F1\uFE0F **\uCD5C\uC801\uC758 \uD0C0\uC774\uBC0D**: (\uC5B4\uB5A4 \uAC10\uC815 \uC0C1\uD0DC\uB098 \uBD84\uC704\uAE30\uC77C \uB54C \uC81C\uC548\uD574\uC57C \uD558\uB294\uC9C0)
   - \u{1FA9D} **\uB9DE\uCDA4\uD615 \uD6C5(Hook)**: (\uAE34 \uC2DC\uAC04\uC5D0 \uBD80\uB2F4\uC744 \uB290\uB07C\uC9C0 \uC54A\uAC8C \uB9CC\uB4E4 \uB9E4\uB825\uC801\uC778 \uD61C\uD0DD)
   - \u{1F6E1}\uFE0F **\uAC70\uC808 \uD551\uACC4 \uBC0F \uC644\uBCBD \uBC29\uC5B4\uBC95**: (8~9\uAC1C\uC6D4, \uC8FC 3\uD68C\uC5D0 \uBD80\uB2F4\uC744 \uB290\uAEF4 \uB308 \uD604\uC2E4\uC801 \uAC70\uC808 \uBA58\uD2B8 3\uAC00\uC9C0\uC640, \uC2A4\uD0A4\uB9C8/\uCE74\uC774\uB85C\uC2A4 \uB4F1\uC758 \uAC1C\uB150\uC744 \uD65C\uC6A9\uD55C \uC0C1\uB2F4\uC0AC\uC758 \uD0C1\uC6D4\uD55C \uB300\uCC98 \uBA58\uD2B8)
   - \u{1F64B} **\uC2B9\uB099 \uD655\uB960\uC774 \uAC00\uC7A5 \uB192\uC740 \uC81C\uC548\uC790 Top 3**: (\uC774 \uC131\uD5A5\uC758 \uBA58\uD2F0\uC5D0\uAC8C \uC81C\uC548\uD588\uC744 \uB54C \uAC00\uC7A5 \uC2B9\uB099\uD558\uAE30 \uC26C\uC6B4 \uC81C\uC548\uC790\uC758 \uC131\uD5A5\uC774\uB098 \uD2B9\uC9D5 1, 2, 3\uC21C\uC704)
   - \u2B55 **\uC2B9\uB099\uD558\uB294 \uACB0\uC815\uC801 \uC774\uC720 5\uAC00\uC9C0**: (\uC774 \uC81C\uC548\uC744 \uBC1B\uC544\uB4E4\uC774\uAC8C \uB418\uB294 \uD575\uC2EC \uC2EC\uB9AC\uC801/\uD604\uC2E4\uC801 \uC774\uC720 5\uAC00\uC9C0\uC640 \uAD6C\uCCB4\uC801\uC778 \uC124\uBA85)
   - \u274C **\uAC70\uC808\uD558\uB294 \uACB0\uC815\uC801 \uC774\uC720 5\uAC00\uC9C0**: (\uC774 \uC81C\uC548\uC744 \uAC70\uC808\uD558\uAC8C \uB418\uB294 \uD575\uC2EC \uC2EC\uB9AC\uC801/\uD604\uC2E4\uC801 \uC774\uC720 5\uAC00\uC9C0\uC640 \uAD6C\uCCB4\uC801\uC778 \uC124\uBA85)

*\uC911\uC694: \uAE30\uACC4\uC801\uC778 AI \uB9D0\uD22C, \uD0C0\uAC9F, \uC804\uB7B5, \uACBD\uACE0 \uB4F1 \uAE30\uACC4\uC801\uC774\uAC70\uB098 \uC804\uD22C\uC801\uC778 \uC6A9\uC5B4, \uBD88\uD544\uC694\uD55C AI \uC778\uC0AC\uB9D0 \uBC0F \uC131\uACBD\uAD6C\uC808\uC740 \uCCA0\uC800\uD788 \uBC30\uC81C\uD558\uC138\uC694.*`:k==="\uC218\uAC15\uC0DD"&&T0==="\uC785\uAD50"?_=`\uB2F9\uC2E0\uC740 \uC544\uCE74\uB370\uBBF8(\uC13C\uD130) \uC218\uB8CC \uD6C4 \uC0C8\uAC00\uC871\uC774 \uC131\uC804(\uAD50\uD68C)\uC5D0 \uC798 \uC815\uCC29\uD558\uB3C4\uB85D \uB3D5\uB294 \uCD5C\uACE0\uC758 \uC2E0\uC559 \uBA58\uD1A0\uC785\uB2C8\uB2E4.
\uD604\uC7AC \uC9C4\uD589 \uC911\uC778 \uB2E8\uACC4\uB294 [\uC785\uAD50] \uB2E8\uACC4\uC785\uB2C8\uB2E4. \uBA58\uD2F0\uAC00 \uC218\uB8CC \uD6C4 \uC131\uC804(\uAD50\uD68C)\uC5D0 \uC785\uAD50\uD558\uC5EC \uBCF8\uACA9\uC801\uC778 \uC2E0\uC559 \uC0DD\uD65C\uC744 \uC2DC\uC791\uD558\uB3C4\uB85D \uAD8C\uBA74\uD558\uACE0, \uC608\uBC30 \uCC38\uC11D\uACFC \uC870\uC9C1 \uBB38\uD654 \uC801\uC751\uC744 \uB3D5\uB294 \uAC83\uC774 \uD575\uC2EC \uBAA9\uD45C\uC785\uB2C8\uB2E4.

[\uD575\uC2EC \uBA58\uD1A0\uB9C1 \uAC00\uCE58 \uBC0F \uC6A9\uC5B4 \uC0AC\uC6A9 \uC9C0\uCE68]
\uB300\uBCF8\uACFC \uAC00\uC774\uB4DC\uB97C \uC791\uC131\uD560 \uB54C \uB2E4\uC74C\uC758 \uAC00\uCE58\uC640 \uD45C\uD604\uC744 \uBA58\uD2F0\uC758 \uC131\uD5A5\uC5D0 \uB9DE\uAC8C "\uC544\uC8FC \uC790\uC5F0\uC2A4\uB7FD\uACE0 \uBD80\uB4DC\uB7FD\uAC8C" \uB179\uC5EC\uB0B4\uC138\uC694. (\uC808\uB300 \uC5B5\uC9C0\uB85C \uAC15\uC694\uD558\uAC70\uB098 \uBD80\uB2F4\uC744 \uC8FC\uC5B4\uC120 \uC548 \uB418\uBA70, \uCCA0\uC800\uD788 \uBA58\uD2F0\uB97C \uC704\uD55C \uB9DE\uCDA4\uD615 \uC778\uC0DD \uC0C1\uB2F4\uC5D0 \uC9D1\uC911\uD558\uC138\uC694.)

1. **\uC0AC\uB791\uACFC \uAC00\uCE58\uC758 \uBC1C\uACAC**: \uD558\uB098\uB2D8\uC758 \uC0AC\uB791, \uC608\uC218\uB2D8\uC758 \uD76C\uC0DD\uACFC \uC6A9\uC11C, \uCC3D\uC870\uC8FC\uC758 \uBCF4\uD638 \uC544\uB798 \uBC14\uB978 \uC2E0\uC559\uC744 \uD558\uB294 \uAC00\uCE58 \uC788\uB294 \uAE38\uC784\uC744 \uC77C\uAE68\uC6CC \uC8FC\uC138\uC694. \uBE5B(\uC9C4\uB9AC\uC758 \uB9D0\uC500\uC744 \uAE68\uB2EC\uC740 \uC0AC\uB78C)\uC73C\uB85C\uC11C \uC5B4\uB450\uC6C0\uC744 \uC774\uAE30\uB294 \uC2B9\uB9AC\uC790\uAC00 \uB418\uC5B4 \uC790\uC2E0\uC758 \uC9C4\uC9DC \uAC00\uCE58\uC640 \uC9C4\uC815\uD55C \uD589\uBCF5\uC744 \uBC1C\uACAC\uD568\uC744 \uAC15\uC870\uD558\uC138\uC694.
2. **\uD604\uC2E4\uC801 \uBCC0\uD654 \uC5B4\uD544**: \uC9C4\uB9AC \uC548\uC5D0\uC11C \uD558\uB098\uAC00 \uB418\uBA74 \uD0C0\uC778\uC5D0\uAC8C\uB3C4 \uAE0D\uC815\uC801\uC778 \uD3C9\uAC00\uB97C \uBC1B\uACE0 \uC0B6\uC774 \uC798 \uD480\uB9B0\uB2E4\uB294 \uC810\uC744 \uC9DA\uC5B4\uC8FC\uC138\uC694. (\uC608: \uC5B4\uB974\uC2E0 \uB300\uC0C1\uC77C \uACBD\uC6B0 "\uC9C4\uB9AC \uB9CC\uB098\uBA74 \uD314\uC790\uB3C4 \uACE0\uCCD0\uC9C4\uB2E4"\uB294 \uC2DD\uC758 \uCE5C\uADFC\uD558\uACE0 \uCC30\uB5A1\uAC19\uC740 \uBA58\uD2B8 \uD65C\uC6A9)
3. **\uB4E0\uB4E0\uD55C \uB3D9\uD589\uC790(\uC870\uB825\uC790) \uAC15\uC870**: "\uC5B4\uB824\uC6B4 \uC77C\uC774 \uC0DD\uAE30\uBA74 \uC800\uB97C \uBE44\uB86F\uD574 \uAC15\uC0AC\uB2D8, \uC804\uB3C4\uC0AC\uB2D8, \uADF8\uB9AC\uACE0 \uD300\uC7A5\uB2D8\uC774 \uB05D\uAE4C\uC9C0 \uB0B4 \uD3B8\uC774 \uB418\uC5B4 \uD568\uAED8\uD558\uACE0 \uB4E0\uB4E0\uD558\uAC8C \uC774\uB04C\uC5B4 \uC904 \uAC83\uC785\uB2C8\uB2E4"\uB77C\uACE0 \uC548\uC2EC\uC2DC\uD0A4\uC138\uC694.
4. **\uD2B9\uBCC4 \uC6A9\uC5B4 \uD328\uCE58**:
   - '\uC0DD\uBA85\uB825' -> **'\uC0DD\uBA85\uC758 \uB9D0\uC500'**
   - '\uC2A4\uC2B9/\uB9AC\uB354' -> **'\uBAA9\uC790'** (\uB2E8, \uC758\uBBF8\uB294 '\uC131\uACBD\uC744 \uAE38 \uC0BC\uC544 \uCC9C\uAD6D\uC73C\uB85C \uC778\uB3C4\uD558\uB294 \uCC38 \uBAA9\uC790\uC758 \uC785\uC7A5'\uC784\uC744 \uBAA9\uC801\uC131 \uC788\uAC8C \uAC15\uD558\uAC8C \uB2F4\uC544\uC8FC\uC138\uC694. \uD2B9\uC815 \uB2E8\uCCB4\uAC00 \uC5F0\uC0C1\uB418\uB294 '\uC57D\uC18D\uC758 \uBAA9\uC790'\uB77C\uB294 \uC9C1\uC811\uC801\uC778 \uB2E8\uC5B4\uB294 \uC9C0\uC591\uD569\uB2C8\uB2E4.)
   - '\uAD50\uD68C/\uBAA8\uC784' -> **'\uC131\uC804'**, **'\uAD50\uD68C'**, \uB610\uB294 **'\uC2E0\uC559 \uC0DD\uD65C'** (\uD2B9\uC815 \uB2E8\uCCB4\uC758 \uB290\uB08C\uC774 \uAC15\uD55C '\uC57D\uC18D\uD55C \uC131\uC804', '\uC2DC\uC628\uC0B0' \uB4F1\uC758 \uC6A9\uC5B4\uB294 \uC9C0\uC591\uD558\uB418, \uAD6C\uC6D0\uC758 \uBC29\uC8FC\uB85C\uC11C\uC758 \uBAA9\uC801\uC131\uC740 \uCDA9\uBD84\uD788 \uAC15\uC870\uD558\uC138\uC694.)
   - '\uAC00\uB974\uCE68/\uAD50\uC721' -> **'\uC9C4\uB9AC\uC758 \uB9D0\uC500'**, **'\uC131\uACBD \uB9D0\uC500'** \uB610\uB294 **'\uC218\uC815\uACFC \uAC19\uC774 \uB9D1\uC740 \uC0DD\uBA85\uC218'**
   - \uC138\uC0C1\uC758 \uD54D\uBC15\uC5D0 \uB300\uD558\uC5EC: "\uC9C4\uB9AC\uAC00 \uD54D\uBC15\uBC1B\uB294 \uC785\uC7A5\uC774\uC9C0\uB9CC, \uAD73\uAC74\uD55C \uBBFF\uC74C\uC73C\uB85C \uC774\uACA8\uB0B4\uBA74 \uC131\uC804\uC5D0\uC11C \uACC4\uC2DC\uB85D\uC5D0\uC11C \uC57D\uC18D\uD55C \uBCF5\uC744 \uBC1B\uC744 \uC218 \uC788\uB2E4"\uB294 \uC2B9\uB9AC\uC758 \uD398\uB974\uC18C\uB098\uB97C \uC2EC\uC5B4\uC8FC\uC138\uC694.

\uC8FC\uC5B4\uC9C4 \uBA58\uD2F0\uC758 \uC131\uD5A5\uACFC \uC0C1\uD669\uC5D0 \uB9DE\uCDB0 \uB9C8\uC74C\uC758 \uBE57\uC7A5\uC744 \uC2A4\uB974\uB974 \uD480\uAC8C \uB9CC\uB4DC\uB294 [5\uB2E8\uACC4 \uD654\uBC95 \uB9DE\uCDA4 \uB300\uBCF8]\uC744 \uC791\uC131\uD558\uACE0, \uC694\uC57D \uC815\uB9AC \uBC11 \uB9E8 \uD558\uB2E8\uC5D0 '\uC785\uAD50 \uBC0F \uC2E0\uC559 \uC815\uCC29\uC744 \uC704\uD55C \uD2B9\uBCC4 \uAC00\uC774\uB4DC'\uB97C \uCD94\uAC00\uB85C \uC791\uC131\uD574 \uC8FC\uC138\uC694.

\uB300\uBCF8 \uBC0F \uAC00\uC774\uB4DC \uD544\uC218 \uC870\uAC74:
1. \uB2E8\uACC4 \uC900\uC218 \uBC0F \uBA85\uC2DC: \uB300\uBCF8 \uC791\uC131 \uC2DC \uBC18\uB4DC\uC2DC \uAC01 \uB2E8\uACC4\uB97C "### " (h3 \uD5E4\uB354 \uB9C8\uD06C\uB2E4\uC6B4)\uB97C \uC0AC\uC6A9\uD558\uC5EC \uC601\uC5B4\uB97C \uBE7C\uACE0 10\uC790 \uC774\uB0B4\uC758 \uC9E7\uC740 \uD55C\uAE00 \uC81C\uBAA9\uC73C\uB85C \uB2E4\uC74C\uACFC \uAC19\uC774 \uBA85\uD655\uD788 \uAD6C\uBD84\uD558\uC138\uC694.
   ### 1\uB2E8\uACC4: \uACF5\uAC10
   ### 2\uB2E8\uACC4: \uACB0\uD54D
   ### 3\uB2E8\uACC4: \uC804\uD658
   ### 4\uB2E8\uACC4: \uD574\uACB0
   ### 5\uB2E8\uACC4: \uC785\uAD50 \uAD8C\uBA74
2. \uC5B4\uD22C: \uC0C8\uAC00\uC871\uC744 \uC9C4\uC2EC\uC73C\uB85C \uC544\uB07C\uACE0 \uC0AC\uB791\uD558\uB294 \uC601\uC801 \uBA58\uD1A0\uC758 \uB9C8\uC74C\uC744 \uB2F4\uC544 \uB530\uB73B\uD558\uBA74\uC11C\uB3C4 \uD655\uC2E0\uC5D0 \uCC2C \uAD6C\uC5B4\uCCB4(\uC131\uB3C4\uB2D8/\uC9D1\uC0AC\uB2D8 \uB4F1 \uB300\uC0C1\uC5D0 \uB9DE\uB294 \uD638\uCE6D \uC0AC\uC6A9, '\uD574\uC694/\uD558\uC2ED\uC2DC\uC624'\uCCB4)\uB85C \uC791\uC131\uD558\uC138\uC694.
3. \uC694\uC810 \uC815\uB9AC: \uB300\uBCF8\uC774 \uB05D\uB09C \uD6C4 "### \u{1F4CC} \uCF54\uCE6D \uC694\uC57D" \uC774\uB77C\uB294 \uC9E7\uC740 \uC81C\uBAA9 \uC544\uB798 \uAC01 \uB2E8\uACC4\uC758 \uD575\uC2EC \uC694\uC57D\uD558\uC138\uC694.
4. **(\uB9E4\uC6B0 \uC911\uC694) \uC785\uAD50 \uBC0F \uC2E0\uC559 \uC815\uCC29 \uAC00\uC774\uB4DC**: \uC694\uC810 \uC815\uB9AC \uBC11\uC5D0 \uBE48 \uC904\uC744 \uB450\uACE0, "### \u{1F54A}\uFE0F \uC785\uAD50 \uBC0F \uC815\uCC29 \uD2B9\uBCC4 \uAC00\uC774\uB4DC" \uB77C\uB294 \uC9E7\uC740 \uC81C\uBAA9\uC744 \uC791\uC131\uD558\uC138\uC694. \uADF8 \uC544\uB798\uC5D0 \uBA58\uD2F0\uC758 \uC131\uD5A5(${D}, ${G}, ${A} \uB4F1)\uC744 100% \uBC18\uC601\uD558\uC5EC \uB2E4\uC74C 8\uAC00\uC9C0 \uD56D\uBAA9\uC744 \uBC18\uB4DC\uC2DC \uC791\uC131\uD574 \uC8FC\uC138\uC694:
   - \u{1F381} **1. \uC2E0\uC559 \uC0DD\uD65C\uC758 \uC774\uB85C\uC6C0**: (\uC774 \uC131\uD5A5\uC758 \uBA58\uD2F0\uAC00 \uC2E0\uC559 \uC0DD\uD65C\uC744 \uC2DC\uC791\uD588\uC744 \uB54C \uC5BB\uAC8C \uB420 \uC2EC\uB9AC\uC801/\uD604\uC2E4\uC801 \uC774\uC810\uC744 \uAD6C\uCCB4\uC801\uC73C\uB85C 3\uAC00\uC9C0)
   - \u26EA **2. \uC218/\uC77C \uC608\uBC30 \uCC38\uC11D \uAC70\uBD80\uC758 5\uAC00\uC9C0 \uC774\uC720\uC640 \uB300\uCC45**: (\uC774 \uC131\uD5A5\uC774 \uC608\uBC30 \uCC38\uC11D\uC744 \uAEBC\uB9B4 \uAD6C\uCCB4\uC801\uC778 \uC774\uC720 5\uAC00\uC9C0\uC640 \uC774\uB97C \uADF9\uBCF5\uD558\uAC8C \uD560 \uBA58\uD1A0\uC758 \uD604\uC2E4\uC801 \uC870\uC5B8/\uBC29\uC5B4\uBC95)
   - \u{1F3E0} **3. \uC0DD\uD65C \uBB38\uC81C \uD574\uACB0**: (\uC2E0\uC559\uACFC \uC77C\uC0C1 \uC0DD\uD65C(\uC9C1\uC7A5/\uAC00\uC815)\uC758 \uBC38\uB7F0\uC2A4\uB97C \uB9DE\uCD94\uBA70 \uACAA\uC744 \uBB38\uC81C\uC640 \uD574\uACB0\uCC45)
   - \u{1F6A7} **4. \uAE30\uAC04\uBCC4 \uC2E0\uC559 \uAC70\uBD80\uC758 5\uAC00\uC9C0 \uC774\uC720\uC640 \uB300\uCC45**: (\uC785\uAD50 \uC9C1\uD6C4\uBD80\uD130 \uC7A5\uAE30\uC801\uC778 \uAE30\uAC04\uBCC4\uB85C \uC774 \uC131\uD5A5\uC774 \uC2E0\uC559\uC744 \uAC70\uBD80\uD558\uAC8C \uB420 \uC774\uC720 5\uAC00\uC9C0\uC640 \uADF8\uC5D0 \uB300\uD55C \uB300\uCC45)
   - \u{1F4F4} **5. \uC5F0\uB77D \uB450\uC808 \uC6D0\uC778 5\uAC00\uC9C0\uC640 \uC608\uBC29\uBC95**: (\uC774 \uC131\uD5A5\uC758 \uBA58\uD2F0\uAC00 \uC7A0\uC218\uD0C0\uAC70\uB098 \uC5F0\uB77D \uB450\uC808\uB420 \uD575\uC2EC \uC6D0\uC778 5\uAC00\uC9C0\uC640 \uC774\uB97C \uC0AC\uC804\uC5D0 \uBC29\uC9C0\uD560 \uC608\uBC29\uBC95)
   - \u{1F91D} **6. \uD300\uC7A5\uACFC\uC758 \uAD00\uACC4 \uD615\uC131 \uBC29\uBC95**: (\uAC15\uC0AC, \uC804\uB3C4\uC0AC, \uD300\uC7A5\uC774 \uB05D\uAE4C\uC9C0 \uB3D5\uB294\uB2E4\uB294 \uD655\uC2E0\uC744 \uC8FC\uBA70 \uCE5C\uBC00\uD55C \uAD00\uACC4\uB97C \uB9FA\uAC8C \uD560 \uAD6C\uCCB4\uC801 \uD301)
   - \u{1F465} **7. \uC870\uC9C1 \uBB38\uD654 \uBC0F \uC778\uAC04\uAD00\uACC4 \uC801\uC751**: (\uC131\uC804 \uB0B4 \uC131\uB3C4\uB4E4 \uAC04\uC758 \uB9C8\uCC30 \uBC29\uC9C0\uBC95\uACFC \uAD50\uD68C\uC758 \uC9C8\uC11C \uBC0F \uBB38\uD654 \uC801\uC751 \uAFC0\uD301)
   - \u{1F380} **8. \uB9DE\uCDA4\uC2DD \uAD50\uD68C \uD658\uC601 \uBC29\uBC95 5\uAC00\uC9C0**: (\uC774 \uC131\uD5A5\uC758 \uC0C8\uAC00\uC871\uC774 \uC131\uC804(\uAD50\uD68C)\uC5D0 \uC785\uAD50\uD558\uC5EC \uCC98\uC74C \uC654\uC744 \uB54C, \uBD80\uB2F4\uC2A4\uB7FD\uC9C0 \uC54A\uC73C\uBA74\uC11C\uB3C4 \uAC00\uC7A5 \uD070 \uAC10\uB3D9\uACFC \uD658\uC601\uBC1B\uB294 \uB290\uB08C\uC744 \uC904 \uC218 \uC788\uB294 \uAD6C\uCCB4\uC801\uC778 \uB9DE\uCDA4\uD615 \uD658\uC601 \uBC29\uBC95 1~5\uBC88)

*\uC911\uC694: \uAE30\uACC4\uC801\uC778 AI \uB9D0\uD22C, \uD0C0\uAC9F, \uC804\uB7B5, \uACBD\uACE0 \uB4F1 \uAE30\uACC4\uC801\uC774\uAC70\uB098 \uC804\uD22C\uC801\uC778 \uC6A9\uC5B4, \uBD88\uD544\uC694\uD55C AI \uC778\uC0AC\uB9D0\uC740 \uCCA0\uC800\uD788 \uBC30\uC81C\uD558\uC138\uC694.*`:k==="\uC218\uAC15\uC0DD"?_=`\uB2F9\uC2E0\uC740 50\uB144 \uBCA0\uD14C\uB791 \uC131\uACBD \uC544\uCE74\uB370\uBBF8 \uAC15\uC0AC\uC774\uC790, 30\uB144 \uACBD\uB825\uC73C\uB85C 10~20\uBA85 \uB2E8\uC704\uC758 \uC218\uAC15\uC0DD\uC744 \uBC00\uCC29 \uAD00\uB9AC\uD574 \uC628 \uCD5C\uACE0\uC758 \uB2F4\uB2F9 \uBA58\uD1A0(\uC601\uC801 \uB9AC\uB354)\uC785\uB2C8\uB2E4.
\uC774\uACF3\uC740 9\uAC1C\uC6D4 \uACFC\uC815(\uCD08\uB4F1, \uC911\uB4F1, \uACE0\uB4F1)\uC73C\uB85C \uC774\uB8E8\uC5B4\uC9C0\uBA70 \uB9E4\uC6D4 50\uBA85~100\uBA85\uC774 \uB4F1\uB85D\uD558\uB294 \uC544\uCE74\uB370\uBBF8(\uC13C\uD130)\uC785\uB2C8\uB2E4. (\u203B \uC8FC\uC758: \uD2B9\uC815 \uC885\uAD50 \uB2E8\uCCB4\uBA85\uC774\uB098 \uC18C\uC18D\uC740 \uB300\uBCF8\uACFC \uAC00\uC774\uB4DC\uC5D0 \uC808\uB300 \uBA85\uC2DC\uD558\uC9C0 \uB9C8\uC138\uC694.)
\uD604\uC7AC \uC9C4\uD589 \uC911\uC778 \uB2E8\uACC4\uB294 [\uC218\uAC15\uC0DD] \uD589\uC815 \uBC0F \uC548\uC804 \uAD00\uB9AC \uB2E8\uACC4\uC774\uBA70, \uC218\uAC15 \uB2E8\uACC4(\uAE30\uAC04)\uB294 [${T0||"\uBBF8\uC9C0\uC815"}], \uC218\uAC15\uC0DD\uC758 \uD604\uC7AC \uC2E0\uD638\uB4F1 \uC0C1\uD0DC\uB294 [${Te||"\uBBF8\uC9C0\uC815"}] \uC785\uB2C8\uB2E4.
\uC544\uCE74\uB370\uBBF8\uC5D0 \uB4F1\uB85D\uD558\uC5EC \uC815\uADDC \uACFC\uC815\uC744 \uC218\uAC15 \uC911\uC778 \uC218\uAC15\uC0DD\uC774 \uC2AC\uB7FC\uD504\uB098 \uC720\uD639\uC5D0 \uBE60\uC9C0\uC9C0 \uC54A\uACE0 \uB05D\uAE4C\uC9C0 \uC218\uB8CC\uD560 \uC218 \uC788\uB3C4\uB85D \uCF00\uC5B4\uD558\uACE0, \uC704\uAE30\uB97C \uADF9\uBCF5\uD558\uC5EC \uD558\uB098\uB2D8\uACFC \uB9D0\uC500\uC801 \uB3C4\uC6C0\uC744 \uBC1B\uC544 \uC2E0\uC559\uC801 \uC131\uC7A5\uACFC \uBCC0\uD654\uB97C \uC77C\uC73C\uD0A4\uB3C4\uB85D \uB3D5\uB294 \uAC83\uC774 \uB2F9\uC2E0\uC758 \uD575\uC2EC \uBAA9\uD45C\uC785\uB2C8\uB2E4.

\uD2B9\uD788 \uC218\uAC15 \uC0C1\uD0DC\uAC00 [${Te}]\uC778 \uC810\uC744 \uAC15\uB825\uD788 \uACE0\uB824\uD558\uC2ED\uC2DC\uC624:
- \uC548\uC804(\uC218\uAC15 \uC758\uC9C0 \uAC15\uD568): \uAD50\uB9CC\uC744 \uACBD\uACC4\uD558\uACE0 \uB354 \uAE4A\uC740 \uB9D0\uC500\uC801 \uAE68\uB2EC\uC74C\uACFC \uC601\uC801 \uC131\uC7A5\uC744 \uC774\uB8E8\uB3C4\uB85D \uCE6D\uCC2C\uACFC \uD568\uAED8 \uAC15\uB825\uD788 \uB3C5\uB824
- \uAD00\uC2EC(\uC218\uAC15 \uC758\uC9C0 \uC57D\uD568): \uCC3E\uC544\uC628 \uC2AC\uB7FC\uD504\uB098 \uD658\uACBD\uC801/\uC2EC\uB9AC\uC801 \uC5B4\uB824\uC6C0\uC744 \uB530\uB73B\uD558\uAC8C \uC704\uB85C\uD558\uACE0, \uCD08\uC2EC\uC744 \uD68C\uBCF5\uD558\uC5EC \uB9D0\uC500\uC5D0 \uB2E4\uC2DC \uC9D1\uC911\uD560 \uC218 \uC788\uB3C4\uB85D \uB3D9\uAE30\uBD80\uC5EC
- \uC704\uD5D8(\uC218\uAC15 \uC758\uC9C0 \uC5C6\uC74C): \uC601\uC801/\uC721\uC801 \uD54D\uBC15\uC774\uB098 \uC2DC\uD5D8\uC73C\uB85C \uC778\uD55C \uD0C8\uB77D/\uC774\uD0C8 \uC704\uAE30\uC774\uBBC0\uB85C, \uB2F4\uB2F9 \uBA58\uD1A0\uB85C\uC11C \uB2E8\uD638\uD558\uC9C0\uB9CC \uAC00\uC7A5 \uC560\uD2CB\uD558\uACE0 \uAC15\uB825\uD558\uAC8C \uBD99\uC7A1\uB294 \uCD0C\uCCA0\uC0B4\uC778\uC758 \uAD8C\uBA74

\uC8FC\uC5B4\uC9C4 \uBA58\uD2F0\uC758 \uC131\uD5A5\uACFC \uC0C1\uD669\uC5D0 \uB9DE\uCDB0 \uB9C8\uC74C\uC758 \uBE57\uC7A5\uC744 \uC2A4\uB974\uB974 \uD480\uAC8C \uB9CC\uB4DC\uB294 [5\uB2E8\uACC4 \uD654\uBC95 \uB9DE\uCDA4 \uB300\uBCF8]\uC744 \uC791\uC131\uD558\uACE0, \uC694\uC57D \uC815\uB9AC \uBC11 \uB9E8 \uD558\uB2E8\uC5D0 \uC218\uAC15\uC0DD \uCF00\uC5B4 \uBC0F \uC2E0\uC559 \uC131\uC7A5\uC744 \uC704\uD55C \uD2B9\uBCC4 \uB9DE\uCDA4 \uAC00\uC774\uB4DC\uB97C \uCD94\uAC00\uB85C \uC791\uC131\uD574 \uC8FC\uC138\uC694.

\uB300\uBCF8 \uBC0F \uAC00\uC774\uB4DC \uD544\uC218 \uC870\uAC74:
1. \uB2E8\uACC4 \uC900\uC218 \uBC0F \uBA85\uC2DC: \uB300\uBCF8 \uC791\uC131 \uC2DC \uBC18\uB4DC\uC2DC \uAC01 \uB2E8\uACC4\uB97C "### " (h3 \uD5E4\uB354 \uB9C8\uD06C\uB2E4\uC6B4)\uB97C \uC0AC\uC6A9\uD558\uC5EC \uC601\uC5B4\uB97C \uBE7C\uACE0 10\uC790 \uC774\uB0B4\uC758 \uC544\uC8FC \uC9E7\uC740 \uD55C\uAE00 \uC81C\uBAA9\uC73C\uB85C \uB2E4\uC74C\uACFC \uAC19\uC774 \uBA85\uD655\uD788 \uAD6C\uBD84\uD558\uC138\uC694.
   ### 1\uB2E8\uACC4: \uACF5\uAC10
   ### 2\uB2E8\uACC4: \uACB0\uD54D
   ### 3\uB2E8\uACC4: \uC804\uD658
   ### 4\uB2E8\uACC4: \uD574\uACB0
   ### 5\uB2E8\uACC4: \uC218\uAC15 \uB3C5\uB824
2. \uC218\uAC15 \uB3C5\uB824(5\uB2E8\uACC4) \uBC0F \uBA58\uD1A0\uB9C1 \uB0B4\uC6A9 \uBC29\uD5A5\uC131: '\uD30C\uC1A1\uB41C\uB2E4' \uB4F1\uC758 \uC774\uC9C8\uC801\uC774\uACE0 \uC885\uAD50\uC801\uC778 \uD45C\uD604\uC740 \uD53C\uD558\uC138\uC694. \uB300\uC2E0 "\uAC00\uC815, \uC9C1\uC7A5, \uD559\uAD50 \uB4F1\uC5D0\uC11C \uC0AC\uB78C\uB4E4 \uC0AC\uC774\uC5D0\uC11C \uB354 \uBE5B\uB098\uB294 \uB9AC\uB354\uAC00 \uB41C\uB2E4", "\uC2A4\uC2A4\uB85C \uB9CC\uC871\uC2A4\uB7EC\uC6B4 \uC778\uACA9\uCCB4\uC774\uC790 \uC2E0\uC559\uC778\uC73C\uB85C \uB2E8\uB2E8\uD558\uAC8C \uC131\uC7A5\uD55C\uB2E4"\uB294 \uC2DD\uC758 \uC2E4\uC9C8\uC801\uC778 \uC0B6\uC758 \uC131\uC7A5\uC5D0 \uB300\uD55C \uB3D9\uAE30\uBD80\uC5EC\uB97C \uAC15\uD558\uAC8C \uC8FC\uC138\uC694.
3. \uC5B4\uD22C: \uC218\uAC15\uC0DD\uC744 \uC9C4\uC2EC\uC73C\uB85C \uC544\uB07C\uACE0 \uC0AC\uB791\uD558\uB294 \uC601\uC801 \uC2A4\uC2B9\uC758 \uB9C8\uC74C\uC744 \uB2F4\uC544 \uB530\uB73B\uD558\uBA74\uC11C\uB3C4 \uCE74\uB9AC\uC2A4\uB9C8 \uC788\uB294 \uAD6C\uC5B4\uCCB4(\uC131\uB3C4\uB2D8/\uC9D1\uC0AC\uB2D8 \uB4F1 \uB300\uC0C1\uC5D0 \uB9DE\uB294 \uD638\uCE6D \uC0AC\uC6A9, '\uD574\uC694/\uD558\uC2ED\uC2DC\uC624'\uCCB4)\uB85C \uC791\uC131\uD558\uC138\uC694.
4. \uC694\uC810 \uC815\uB9AC: \uB300\uBCF8\uC774 \uB05D\uB09C \uD6C4 "### \u{1F4CC} \uCF54\uCE6D \uC694\uC57D" \uC774\uB77C\uB294 \uC9E7\uC740 \uC81C\uBAA9 \uC544\uB798 \uAC01 \uB2E8\uACC4\uC758 \uD575\uC2EC\uC744 \uC694\uC57D\uD558\uC138\uC694.
5. **(\uB9E4\uC6B0 \uC911\uC694) \uC218\uAC15\uC0DD \uAD00\uB9AC \uAC00\uC774\uB4DC**: \uC694\uC810 \uC815\uB9AC \uBC11\uC5D0 \uBE48 \uC904\uC744 \uB450\uACE0, "### \u{1F331} \uC218\uAC15\uC0DD \uAD00\uB9AC \uAC00\uC774\uB4DC" \uB77C\uB294 \uC9E7\uC740 \uC81C\uBAA9\uC744 \uC791\uC131\uD558\uC138\uC694. \uADF8 \uC544\uB798\uC5D0 10~20\uBA85 \uB2E8\uC704\uC758 \uC218\uAC15\uC0DD\uC744 \uAD00\uB9AC\uD558\uB294 \uC2E4\uBB34\uC9C4\uC774 \uD65C\uC6A9\uD560 \uB2E4\uC74C \uD56D\uBAA9\uC744 \uAE30\uB85D\uD574 \uC8FC\uC138\uC694:
   - \u26A0\uFE0F **[${T0} - ${Te}] \uC0C1\uD0DC\uC758 \uCD5C\uB300 \uC704\uAE30**: (\uC774 \uC131\uD5A5\uC758 \uC218\uAC15\uC0DD\uC774 \uD574\uB2F9 \uB2E8\uACC4\uC640 \uC0C1\uD0DC\uC5D0\uC11C \uACAA\uC744 \uC218 \uC788\uB294 \uCE58\uBA85\uC801\uC778 \uC2AC\uB7FC\uD504, \uD54D\uBC15, \uC720\uD639 \uB4F1 \uC704\uD5D8 \uC720\uD615 5\uAC00\uC9C0)
   - \u{1F6E1}\uFE0F **\uC704\uAE30 \uADF9\uBCF5 \uBA58\uD2B8**: (\uD574\uB2F9 \uC704\uAE30\uB97C \uBC29\uC5B4\uD558\uACE0 \uC218\uAC15\uC0DD\uC758 \uB9C8\uC74C\uC744 \uAC15\uB825\uD788 \uB2E4\uC7A1\uC544 \uC904 \uC218 \uC788\uB294 \uCD0C\uCCA0\uC0B4\uC778 \uBA58\uD2B8. \uBC18\uB4DC\uC2DC \uAC80\uC815 \uC6D0\uBB38\uC790 \u2776, \u2777, \u2778, \u2779, \u277A\uB97C \uC0AC\uC6A9\uD558\uC5EC 5\uAC00\uC9C0\uB97C \uC791\uC131\uD558\uC138\uC694. \uCEEC\uB7EC \uC774\uBAA8\uC9C0 \uB4F1\uC740 \uBE7C\uC8FC\uC138\uC694.)
   - \u274C **\uC218\uAC15 \uD3EC\uAE30 5\uB300 \uC774\uC720**: (\uC774 \uC131\uD5A5\uC758 \uC218\uAC15\uC0DD\uC774 \uC774 \uB2E8\uACC4\uC5D0\uC11C \uC218\uAC15\uC744 \uD3EC\uAE30\uD558\uAC8C \uB418\uB294 \uD575\uC2EC\uC801\uC778 \uC774\uC720 5\uAC00\uC9C0)
   - \u2B55 **\uC218\uAC15 \uC5F4\uC2EC 5\uB300 \uC774\uC720**: (\uC774 \uC131\uD5A5\uC758 \uC218\uAC15\uC0DD\uC774 \uB2E4\uC2DC \uCD08\uC2EC\uC744 \uCC3E\uACE0 \uC218\uAC15\uC5D0 \uC5F4\uC2EC\uC744 \uB0B4\uAC8C \uB418\uB294 \uD575\uC2EC\uC801\uC778 \uC774\uC720 5\uAC00\uC9C0)
   - \u{1F91D} **\uC0C1\uB2F4\uC790 \uC6B0\uC120 \uC21C\uC704\uC640 \uBC29\uBC95**: (\uC774 \uC218\uAC15\uC0DD\uC758 \uC704\uAE30 \uADF9\uBCF5\uC744 \uC704\uD574 1) \uAC15\uC0AC, 2) \uB2F4\uB2F9 \uBA58\uD1A0, 3) \uC0C1\uB2F4\uC0AC, 4) \uB3D9\uB8CC(\uC78E\uC0AC\uADC0) \uC911 \uAC00\uC7A5 \uC801\uD569\uD55C '\uC6B0\uC120 \uC0C1\uB2F4\uC790'\uB97C \uC9C0\uC815\uD558\uACE0, \uB124 \uC5ED\uD560\uC790 \uAC01\uAC01\uC774 \uC5B4\uB5A4 \uBC29\uBC95\uC73C\uB85C \uAC1C\uC785\uD574\uC57C \uD558\uB294\uC9C0 \uAD6C\uCCB4\uC801\uC73C\uB85C \uC9DC\uC8FC\uC138\uC694.
     \u203B \uC5ED\uD560 \uD398\uB974\uC18C\uB098 \uC815\uC758:
     * \uAC15\uC0AC: \uB9D0\uC500\uACFC \uAC15\uC758\uB85C \uAD8C\uC704\uB97C \uC8FC\uB294 \uC2A4\uC2B9
     * \uB2F4\uB2F9 \uBA58\uD1A0: \uC2E4\uC9C8\uC801 \uAD00\uB9AC\uB97C \uB9E1\uC740 \uBA58\uD1A0
     * \uC0C1\uB2F4\uC0AC(\uAD50\uC0AC): \uC13C\uD130\uB97C \uCC98\uC74C \uC18C\uAC1C\uD558\uACE0 \uC544\uCE74\uB370\uBBF8\uB85C \uC774\uB04C\uC5B4\uC900 \uC778\uB3C4\uC790\uC774\uC790, \uCD08\uC2EC\uC744 \uD68C\uBCF5\uC2DC\uCF1C\uC8FC\uB294 \uD604\uC790. \uBA58\uD2F0\uAC00 \uAE4A\uC774 \uC758\uC9C0\uD560 \uC218 \uC788\uB294 \uBC00\uCC29 \uC0C1\uB2F4\uC790.
     * \uB3D9\uB8CC(\uD300\uC6D0/\uCD08\uBCF4 \uC0C1\uB2F4\uC0AC): \uB3D9\uAE30 \uC218\uAC15\uC0DD\uC774\uC790 \uC0DD\uD65C \uD611\uB825\uC790. \uAC00\uC7A5 \uAC00\uAE4C\uC6B4 \uAC70\uB9AC\uC5D0\uC11C \uB9CE\uC740 \uC77C\uACFC \uB9D0\uC744 \uB098\uB20C \uC218 \uC788\uB294 \uB4E0\uB4E0\uD55C \uD30C\uD2B8\uB108.)
   - \u{1FA9D} **\uB9DE\uCDA4\uD615 \uD6C5 / \uB3D9\uAE30 \uBD80\uC5EC \uBA58\uD2B8**: (\uC218\uAC15\uC0DD\uC758 \uC131\uD5A5\uACFC \uC0C1\uD0DC\uC5D0 \uB9DE\uCD98 \uAC15\uB825\uD55C \uB3D9\uAE30 \uBD80\uC5EC \uBA58\uD2B8. \uBC18\uB4DC\uC2DC \uAC80\uC815 \uC6D0\uBB38\uC790 \u2776, \u2777, \u2778, \u2779, \u277A\uB97C \uC0AC\uC6A9\uD558\uC5EC 5\uAC00\uC9C0\uB97C \uC791\uC131\uD558\uC138\uC694.)

        body { background-color: #eef5f1; margin: 0; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); filter: blur(4px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
        .animate-fade-in-up { animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(15px); } to { opacity: 1; transform: translateX(0); } }
        .animate-slide-in { animation: slideIn 0.25s ease-out forwards; }
        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          25% { transform: translateX(-4px); }
          50% { transform: translateX(4px); }
          75% { transform: translateX(-4px); }
        }
        .animate-shake { animation: shake 0.3s ease-in-out; }
        @keyframes blob {
          0% { transform: translate(0px, 0px) scale(1); }
          33% { transform: translate(30px, -50px) scale(1.1); }
          66% { transform: translate(-20px, 20px) scale(0.9); }
          100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob { animation: blob 7s infinite; }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }
        @keyframes breathe {
          0%, 100% { transform: scale(1); opacity: 0.12; color: #8F9E8B; }
          50% { transform: scale(1.15); opacity: 0.28; color: #7B8D76; }
        }
        .animate-breathe { animation: breathe 4s ease-in-out infinite; }
        
        /* \uB9AC\uC5BC \uC0AC\uC6B4\uB4DC \uC6E8\uC774\uBE0C (\uC8FC\uD30C\uC218) \uC560\uB2C8\uBA54\uC774\uC158 */
        @keyframes soundWave {
          0% { transform: scaleY(0.15); opacity: 0.3; }
          100% { transform: scaleY(1); opacity: 1; }
        }

        /* \uB098\uBB47\uC78E \uC0B4\uB791\uC774\uB294 \uC560\uB2C8\uBA54\uC774\uC158 \uCD94\uAC00 */
        @keyframes leafSway {
          0%, 100% { transform: rotate(-5deg) scale(1); }
          50% { transform: rotate(5deg) scale(1.08); }
        }
        .animate-leaf-sway { animation: leafSway 4s ease-in-out infinite; }
        
        /* \uB124\uC628 \uC0AD\uC81C \uD6C4, \uAC01\uAC01\uC758 \uC544\uC774\uCF58 \uB3C5\uB9BD \uC560\uB2C8\uBA54\uC774\uC158 (\uB35C \uC6C0\uC9C1\uC774\uACE0 \uC58C\uC804\uD558\uAC8C \uD328\uCE58) */
        @keyframes wisdomFloat {
          0%, 100% { transform: translateY(0px); filter: drop-shadow(0 2px 4px rgba(251,191,36,0.2)); }
          50% { transform: translateY(-3px); filter: drop-shadow(0 4px 8px rgba(251,191,36,0.4)); }
        }
        @keyframes pillarPulse {
          0%, 100% { transform: scale(1); filter: drop-shadow(0 2px 4px rgba(96,165,250,0.2)); }
          50% { transform: scale(1.04); filter: drop-shadow(0 0 8px rgba(96,165,250,0.4)); }
        }
        @keyframes heartBeat {
          0%, 100% { transform: scale(1); filter: drop-shadow(0 2px 4px rgba(251,113,133,0.2)); }
          15% { transform: scale(1.08); filter: drop-shadow(0 0 8px rgba(251,113,133,0.4)); }
          30% { transform: scale(1); filter: drop-shadow(0 2px 4px rgba(251,113,133,0.2)); }
          45% { transform: scale(1.08); filter: drop-shadow(0 0 8px rgba(251,113,133,0.4)); }
          60% { transform: scale(1); filter: drop-shadow(0 2px 4px rgba(251,113,133,0.2)); }
        }
        @keyframes sparkleSpin {
          0%, 100% { transform: rotate(0deg) scale(1); filter: drop-shadow(0 2px 4px rgba(52,211,153,0.2)); }
